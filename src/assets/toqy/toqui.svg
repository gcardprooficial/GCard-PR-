<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .outline { stroke: #0B1F1A; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .bg-green { fill: #0B7A55; }
      .highlight-mint { fill: #34D399; }
      .belly-white { fill: #FFFFFF; }
      .cheek-yellow { fill: #FFC83D; }
      .spark-yellow { fill: #FFC83D; }
      .eye-white { fill: #FFFFFF; }
      .pupil-dark { fill: #14141A; }
    </style>
  </defs>

  <!-- Brilho/Faísca AI -->
  <g id="spark" class="spark-yellow">
    <path d="M 175,45 Q 175,55 185,55 Q 175,55 175,65 Q 175,55 165,55 Q 175,55 175,45 Z" />
  </g>

  <!-- Ondas de Sinal (NFC/Wi-Fi) -->
  <g id="arcs" class="outline" fill="none">
    <path d="M 86,34 A 18,18 0 0,1 114,34" stroke-width="5" />
    <path d="M 78,25 A 28,28 0 0,1 122,25" stroke-width="5" />
    <path d="M 70,16 A 38,38 0 0,1 130,16" stroke-width="5" />
  </g>

  <!-- Corpo e Pés -->
  <g id="body">
    <!-- Pé Esquerdo -->
    <path d="M 68,165 C 68,175 80,175 80,165 Z" class="bg-green outline" />
    <!-- Pé Direito -->
    <path d="M 120,165 C 120,175 132,175 132,165 Z" class="bg-green outline" />
    <!-- Corpo Principal (Squircle) -->
    <rect x="50" y="48" width="100" height="120" rx="42" ry="42" class="bg-green outline" />
    <!-- Brilho Mint no Topo Esquerdo -->
    <path d="M 85,52 Q 54,54 54,85" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <!-- Conector de cima -->
    <path d="M 94,48 Q 100,42 106,48 Z" class="bg-green outline" />
  </g>

  <!-- Braços -->
  <g id="arms" class="outline">
    <path d="M 52,105 C 38,107 34,127 48,132 C 54,131 54,115 54,110" class="bg-green" />
    <path d="M 148,105 C 162,107 166,127 152,132 C 146,131 146,115 146,110" class="bg-green" />
  </g>

  <!-- Barriga -->
  <g id="belly">
    <path d="M 65,135 C 65,110 135,110 135,135 C 135,160 65,160 65,135 Z" class="belly-white outline" />
  </g>

  <!-- Bochechas -->
  <g id="cheeks" class="cheek-yellow">
    <ellipse cx="64" cy="113" rx="7" ry="5" />
    <ellipse cx="136" cy="113" rx="7" ry="5" />
  </g>

  <!-- Olho Esquerdo -->
  <g id="left-eye">
    <circle cx="78" cy="94" r="13" class="eye-white outline" />
    <g id="left-pupil">
      <circle cx="80" cy="94" r="7" class="pupil-dark" />
      <circle cx="78" cy="91" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Olho Direito -->
  <g id="right-eye">
    <circle cx="122" cy="94" r="13" class="eye-white outline" />
    <g id="right-pupil">
      <circle cx="120" cy="94" r="7" class="pupil-dark" />
      <circle cx="118" cy="91" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Boca -->
  <g id="mouth">
    <path d="M 94,106 Q 100,111 106,106" fill="none" class="outline" stroke-width="4.5" />
  </g>
</svg>